<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWI Game - Click & Earn</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="container">
            <div class="logo">
                <h1>OWI</h1>
                <p class="subtitle">Click & Earn Game</p>
            </div>
            <div class="login-form">
                <input type="text" id="playerName" placeholder="Masukkan nama kamu" maxlength="20" required>
                <button id="startBtn" class="btn-primary">MULAI BERMAIN</button>
                <button id="switchPlayerBtn" class="btn-secondary">GANTI PEMAIN</button>
                <div id="savedPlayers" class="saved-players"></div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <header class="game-header">
            <div class="player-info">
                <span class="player-name" id="displayName"></span>
                <div class="points-display">
                    <span class="points-label">POINTS</span>
                    <span class="points-value" id="totalPoints">0</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="shopBtn" class="btn-icon">🛒</button>
                <button id="leaderboardBtn" class="btn-icon">🏆</button>
                <button id="logoutBtn" class="btn-icon">🚪</button>
            </div>
        </header>

        <main class="game-area">
            <div class="click-zone" id="clickZone">
                <div class="click-circle">
                    <span class="click-text">CLICK</span>
                    <span class="click-subtext" id="pointsPerClick">+1</span>
                </div>
                <div class="floating-image" id="floatingImage"></div>
            </div>
            
            <div class="video-overlay" id="videoOverlay">
                <div class="video-placeholder">🎬</div>
                <div class="bonus-text" id="bonusText"></div>
            </div>
        </main>

        <div class="level-info">
            <span>Level: <strong id="upgradeLevel">1</strong></span>
            <span>Next Upgrade: <strong id="nextUpgradeCost">10000</strong> pts</span>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>UPGRADE SHOP</h2>
                <button class="close-btn" id="closeShop">✕</button>
            </div>
            <div class="shop-items">
                <div class="shop-item">
                    <div class="item-info">
                        <h3>Click Upgrade</h3>
                        <p>Level: <span id="shopCurrentLevel">1</span></p>
                        <p>Points/click: <span id="shopCurrentPoints">1</span></p>
                    </div>
                    <button id="upgradeBtn" class="btn-upgrade">
                        UPGRADE
                        <span class="cost">Cost: <span id="upgradeCost">10000</span> pts</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏆 LEADERBOARD</h2>
                <button class="close-btn" id="closeLeaderboard">✕</button>
            </div>
            <div class="leaderboard-list" id="leaderboardList"></div>
            <div class="leaderboard-timer">
                <button id="resetLeaderboardBtn" class="btn-reset">🔄 Reset Mingguan</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
