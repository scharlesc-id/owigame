<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWI Game - Click & Earn</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loginScreen" class="screen active">
        <div class="container">
            <div class="logo">
                <h1>OWI</h1>
                <p class="subtitle">Click & Earn Game</p>
            </div>
            <div class="login-form">
                <input type="text" id="playerName" placeholder="Masukkan nama kamu" maxlength="20" required>
                <button id="startBtn" class="btn-primary">MULAI BERMAIN</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <header class="game-header">
            <div class="player-info">
                <span class="player-name" id="displayName"></span>
                <div class="points-display">
                    <span class="points-label">POINTS</span>
                    <span class="points-value" id="totalPoints">0</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="shopBtn" class="btn-icon">🛒</button>
                <button id="leaderboardBtn" class="btn-icon">🏆</button>
            </div>
        </header>

        <main class="game-area">
            <div class="click-zone" id="clickZone">
                <div class="click-circle">
                    <span class="click-text">CLICK</span>
                    <span class="click-subtext" id="pointsPerClick">+1</span>
                </div>
                <div class="floating-image" id="floatingImage"></div>
            </div>
            
            <div class="video-overlay" id="videoOverlay">
                <video id="secretVideo" autoplay muted>
                    <source src="secret-sound.mp4" type="video/mp4">
                </video>
                <div class="bonus-text" id="bonusText"></div>
            </div>
        </main>

        <div class="level-info">
            <span>Level Upgrade: <strong id="upgradeLevel">1</strong></span>
            <span>Next Upgrade: <strong id="nextUpgradeCost">10000</strong> pts</span>
        </div>
    </div>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>UPGRADE SHOP</h2>
                <button class="close-btn" id="closeShop">✕</button>
            </div>
            <div class="shop-items">
                <div class="shop-item">
                    <div class="item-info">
                        <h3>Click Upgrade</h3>
                        <p>Level saat ini: <span id="shopCurrentLevel">1</span></p>
                        <p>Points per click: <span id="shopCurrentPoints">1</span></p>
                    </div>
                    <button id="upgradeBtn" class="btn-upgrade">
                        UPGRADE
                        <span class="cost">Cost: <span id="upgradeCost">10000</span> pts</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏆 LEADERBOARD MINGGUAN</h2>
                <button class="close-btn" id="closeLeaderboard">✕</button>
            </div>
            <div class="leaderboard-list" id="leaderboardList">
                <div class="loading">Memuat data...</div>
            </div>
            <div class="leaderboard-timer">
                Reset dalam: <span id="countdownTimer">6 hari 23:59:59</span>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Konfigurasi Supabase (GANTI DENGAN URL & KEY PROJEK KAMU)
        const supabaseUrl = 'https://ktqdxonzxrielodmzqtb.supabase.co';
        const supabaseKey = 'sb_publishable_irVVjDNfQw1ZMDDiMKrM7g_q6ZADV-O';
        
        // Inisialisasi Supabase Client
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        // Sediakan secara global untuk script.js
        window.supabase = supabaseClient;
    </script>
    
    <script src="script.js"></script>
</body>
</html>
